[project]
name = "vulnfeed"
version = "0.1.0"
description = "Трекер CVE и вендорских EOL/анонсов: сбор по расписанию, SQLite, статика"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vulnfeed-collect = "vulnfeed.collect:main"
vulnfeed-render = "vulnfeed.render:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vulnfeed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
